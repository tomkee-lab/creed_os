<!doctype html>
<html lang="en" class="light" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>CREED OS — Learner Intelligence & Navigation Platform</title>
		<script>
			(function() {
				try {
					var saved = localStorage.getItem('way_theme');
					var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
					var isDark = saved === 'dark' || (saved === null && prefersDark);
					var html = document.documentElement;
					if (isDark) {
						html.classList.add('dark');
						html.classList.remove('light');
						html.setAttribute('data-theme', 'dark');
						html.style.colorScheme = 'dark';
					} else {
						html.classList.remove('dark');
						html.classList.add('light');
						html.setAttribute('data-theme', 'light');
						html.style.colorScheme = 'light';
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="min-h-screen bg-canvas text-ink antialiased selection:bg-brand/20 selection:text-brand">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
