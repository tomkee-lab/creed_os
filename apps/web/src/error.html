<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>%sveltekit.status% · Service Notice — CREED OS</title>
		<style>
			:root {
				--bg-canvas: #0c0e12;
				--bg-surface: #14171f;
				--bg-surface-raised: #1c202a;
				--border: #282d3b;
				--text-primary: #f0f2f5;
				--text-secondary: #9aa0ac;
				--text-muted: #626978;
				--accent: #00d284;
				--accent-foreground: #042718;
				--critical: #ff5252;
			}
			@media (prefers-color-scheme: light) {
				:root {
					--bg-canvas: #f8f9fa;
					--bg-surface: #ffffff;
					--bg-surface-raised: #f1f3f5;
					--border: #e2e4e8;
					--text-primary: #12151b;
					--text-secondary: #58606e;
					--text-muted: #8c95a5;
					--accent: #00875a;
					--accent-foreground: #ffffff;
					--critical: #cf3a3a;
				}
			}
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
				background-color: var(--bg-canvas);
				color: var(--text-primary);
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				padding: 24px;
				-webkit-font-smoothing: antialiased;
			}
			header {
				max-width: 800px;
				width: 100%;
				margin: 0 auto;
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding-bottom: 24px;
			}
			.brand {
				font-size: 13px;
				font-weight: 600;
				letter-spacing: -0.01em;
				color: var(--text-primary);
				text-decoration: none;
				display: flex;
				align-items: center;
				gap: 8px;
			}
			.brand-badge {
				display: inline-block;
				width: 18px;
				height: 18px;
				background-color: var(--accent);
				border-radius: 0px;
			}
			.status-pill {
				font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
				font-size: 10px;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				padding: 3px 8px;
				border: 1px solid var(--border);
				background-color: var(--bg-surface);
				color: var(--text-muted);
			}
			main {
				max-width: 440px;
				width: 100%;
				margin: auto;
				background-color: var(--bg-surface-raised);
				border: 1px solid var(--border);
				padding: 32px 28px;
				border-radius: 0px;
			}
			.tag {
				font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
				font-size: 10px;
				color: var(--text-muted);
				letter-spacing: 0.06em;
				text-transform: uppercase;
				margin-bottom: 12px;
			}
			h1 {
				font-size: 20px;
				font-weight: 600;
				letter-spacing: -0.02em;
				margin-bottom: 8px;
				color: var(--text-primary);
			}
			p.message {
				font-size: 13px;
				line-height: 1.5;
				color: var(--text-secondary);
				margin-bottom: 24px;
			}
			.actions {
				display: flex;
				flex-direction: column;
				gap: 8px;
				border-top: 1px solid var(--border);
				padding-top: 20px;
			}
			.btn-primary {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				background-color: var(--accent);
				color: var(--accent-foreground);
				font-size: 12px;
				font-weight: 600;
				padding: 10px 16px;
				text-decoration: none;
				border-radius: 0px;
				transition: opacity 140ms ease;
			}
			.btn-primary:hover {
				opacity: 0.9;
			}
			.btn-secondary {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				background-color: transparent;
				color: var(--text-secondary);
				font-size: 12px;
				padding: 8px 16px;
				text-decoration: none;
				border: 1px solid var(--border);
				border-radius: 0px;
				transition: all 140ms ease;
			}
			.btn-secondary:hover {
				color: var(--text-primary);
				background-color: var(--bg-surface);
			}
			footer {
				text-align: center;
				font-size: 11px;
				color: var(--text-muted);
				padding-top: 24px;
			}
		</style>
	</head>
	<body>
		<header>
			<a href="/" class="brand">
				<span class="brand-badge"></span>
				CREED OS
			</a>
			<span class="status-pill">HTTP %sveltekit.status%</span>
		</header>
		<main>
			<div class="tag">Security &amp; Policy Notice</div>
			<h1>Access Restricted</h1>
			<p class="message">%sveltekit.error.message%</p>
			<div class="actions">
				<a href="/login" class="btn-primary">Sign In / Switch Persona</a>
				<a href="/student" class="btn-secondary">Return to Learner Home</a>
				<a href="/" class="btn-secondary">Return to Homepage</a>
			</div>
		</main>
		<footer>
			CREED OS Learner Intelligence Platform · Zero Production Data Leaks Policy
		</footer>
	</body>
</html>
