name: Greptile PR Review & Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: greptile-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  code-quality-and-greptile-check:
    name: Code Quality & Greptile Compliance
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies (pnpm only)
        run: pnpm install --frozen-lockfile

      - name: Verify Monorepo Type Check
        run: pnpm run check

      - name: Run Package Unit Tests (vitest)
        run: pnpm test

      - name: Check Greptile Review Status (if GREPTILE_API_KEY configured)
        if: env.GREPTILE_API_KEY != ''
        env:
          GREPTILE_API_KEY: ${{ secrets.GREPTILE_API_KEY }}
        run: |
          echo "Checking Greptile review status for commit ${{ github.sha }}..."
          pnpm run greptile:status -- --commit ${{ github.sha }}

      - name: PR Review Helper Comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `### ⚠️ Quality Gate Check Failed
            Please ensure all tests pass and that your PR conforms to the CREED OS architectural invariants defined in \`.greptile/rules.md\`.
            You can trigger a fresh Greptile AI review at any time by commenting:
            \`\`\`
            @greptileai review
            \`\`\`
            `;
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
              console.log(`[CI Helper] Successfully posted quality gate guidance comment to PR #${context.issue.number}`);
            } catch (err) {
              console.error(`[CI Helper] Failed to post PR guidance comment: ${err instanceof Error ? err.message : String(err)}`);
            }
